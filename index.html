<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#0b5d73">

  <title>DRYNIEL - Construção a Seco</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- =========================
       CABEÇALHO
  ========================== -->

  <header class="top-header">

    <div class="brand">
      <h1>DRYNIEL</h1>
      <p>CONSTRUÇÃO A SECO</p>
    </div>

    <button
      id="themeBtn"
      class="theme-btn"
      type="button"
      aria-label="Alternar tema"
    >
      ◐
    </button>

  </header>


  <!-- =========================
       CONTEÚDO PRINCIPAL
  ========================== -->

  <main class="app-container">


    <!-- =========================
         TELA INÍCIO
    ========================== -->

    <section
      id="homeScreen"
      class="screen active"
    >

      <div class="page-header">
        <h2>Início</h2>
        <p>Gestão da DRYNIEL</p>
      </div>


      <div class="menu-grid">

        <button
          class="menu-card"
          type="button"
          data-screen="budgetsScreen"
        >
          <span class="menu-icon">▤</span>

          <span class="menu-text">
            <strong>Orçamentos</strong>
            <small>Criar e consultar</small>
          </span>
        </button>


        <button
          class="menu-card"
          type="button"
          data-screen="worksScreen"
        >
          <span class="menu-icon">▣</span>

          <span class="menu-text">
            <strong>Obras</strong>
            <small>Cadastrar obras</small>
          </span>
        </button>


        <button
          class="menu-card"
          type="button"
          data-screen="employeesScreen"
        >
          <span class="menu-icon">♙</span>

          <span class="menu-text">
            <strong>Funcionários</strong>
            <small>Diárias e pagamentos</small>
          </span>
        </button>

      </div>

    </section>



    <!-- =========================
         TELA ORÇAMENTOS
    ========================== -->

    <section
      id="budgetsScreen"
      class="screen"
    >

      <div class="page-header page-header-row">

        <div>
          <h2>Orçamentos</h2>
          <p>Crie e consulte seus orçamentos</p>
        </div>

        <button
          id="newBudgetBtn"
          class="primary-btn"
          type="button"
        >
          + Novo
        </button>

      </div>


      <!-- FORMULÁRIO -->

      <form id="budgetForm">


        <!-- DADOS DO CLIENTE -->

        <div class="card">

          <h3>Dados do cliente</h3>

          <div class="form-group">

            <label for="clientName">
              Nome do cliente
            </label>

            <input
              id="clientName"
              type="text"
              placeholder="Nome do cliente"
              required
            >

          </div>


          <div class="form-group">

            <label for="clientAddress">
              Endereço
            </label>

            <input
              id="clientAddress"
              type="text"
              placeholder="Endereço do cliente ou da obra"
            >

          </div>

        </div>



        <!--
